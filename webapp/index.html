<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5B4DF5" />
    <title>MedTech Fixaters - Smart OPD & EMR System</title>
    <meta name="description" content="MedTech Fixaters - Digital OPD reception, smart QR queue management, and 30-second EMR prescriptions." />

    <!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.medtechfixaters.in/" />
    <meta property="og:title" content="MedTech Fixaters - Smart OPD & EMR System" />
    <meta property="og:description" content="Transform paper OPDs into high-speed digital smart clinics with QR check-in, live queue displays, and voice-assisted EMR." />
    <meta property="og:image" content="https://www.medtechfixaters.in/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MedTech Fixaters - Smart OPD & EMR System" />
    <meta name="twitter:description" content="Digital OPD reception, smart QR queue management, and 30-second EMR prescriptions." />
    <meta name="twitter:image" content="https://www.medtechfixaters.in/og-image.png" />

    <!-- Premium Clinical Fonts: Plus Jakarta Sans, Outfit, Inter, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
    <!-- Cashfree Payment SDK Preconnect & Direct Loader -->
    <link rel="preconnect" href="https://sdk.cashfree.com">
    <link rel="dns-prefetch" href="https://sdk.cashfree.com">
    <script id="cashfree-sdk-v3" src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
  </head>
  <body class="bg-[#F8FAFC]">
    <div id="root">
      <!-- Branded Clinical Preloader (Zero Flash of Unstyled Content) -->
      <div id="app-preloader" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0F172A;font-family:system-ui,-apple-system,sans-serif;color:#ffffff;text-align:center;padding:20px;box-sizing:border-box">
        <div style="position:relative;width:68px;height:68px;margin-bottom:20px">
          <div style="position:absolute;inset:0;border-radius:20px;background:linear-gradient(135deg,#6366F1,#4F46E5);opacity:0.35;filter:blur(14px)"></div>
          <img src="/assets/brand-icon.png" alt="MedTech Fixaters" style="position:relative;width:68px;height:68px;object-fit:contain;border-radius:18px" onerror="this.style.display='none'">
        </div>
        <h1 style="font-size:22px;font-weight:800;letter-spacing:-0.03em;margin:0 0 6px 0;background:linear-gradient(to right,#ffffff,#94A3B8);-webkit-background-clip:text;-webkit-text-fill-color:transparent">MedTech Fixaters</h1>
        <p style="font-size:12px;color:#94A3B8;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;margin:0 0 24px 0">Clinical Operating System</p>
        <div style="width:160px;height:4px;background:#1E293B;border-radius:999px;overflow:hidden">
          <div style="width:50%;height:100%;background:linear-gradient(90deg,#6366F1,#818CF8);border-radius:999px;animation:loaderPulse 1.2s infinite ease-in-out"></div>
        </div>
        <style>
          @keyframes loaderPulse {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(200%); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
