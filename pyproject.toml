[project]
name = "clinic-os"
version = "1.0.0"
description = "Clinic OS Patient Workflow Automation Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",
    "sqlalchemy>=2.0.23",
    "asyncpg>=0.29.0",
    "alembic>=1.12.1",
    "psycopg2-binary>=2.9.9",
    "cryptography>=41.0.0",
    "httpx>=0.25.2"
]

[tool.vercel]
entrypoint = "clinic_os.main:app"
